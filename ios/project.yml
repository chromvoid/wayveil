name: Wayveil
options:
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '8'
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Wayveil:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: ../routing/default-rules.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chromvoid.vpn
        INFOPLIST_FILE: Configuration/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PacketTunnel
        embed: true
      - sdk: MetalKit.framework
      - sdk: CoreMotion.framework
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - Tunnel
      - Shared
      - path: App/Resources/PrivacyInfo.xcprivacy
      - path: ../routing/default-rules.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chromvoid.vpn.Tunnel
        INFOPLIST_FILE: Configuration/Tunnel-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Tunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        OTHER_LDFLAGS: ['$(inherited)', '-ObjC', '-lresolv']
    dependencies:
      - framework: Frameworks/WayveilCore.xcframework
        embed: false
      - framework: Frameworks/HevSocks5Tunnel.xcframework
        embed: false
      - sdk: UIKit.framework
      - sdk: Network.framework
  WayveilTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Shared
      - path: App/PortalMotion.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chromvoid.vpn.ProfileTests
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS: ['$(inherited)', '-ObjC', '-lresolv']
    dependencies:
      - target: Wayveil
      - framework: Frameworks/WayveilCore.xcframework
        embed: false
      - framework: Frameworks/HevSocks5Tunnel.xcframework
        embed: false
      - sdk: UIKit.framework
      - sdk: Network.framework
schemes:
  Wayveil:
    build:
      targets:
        Wayveil: all
        WayveilTests: [test]
    test:
      targets: [WayveilTests]
